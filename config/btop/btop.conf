# btop 配置。只写和默认值不同的项，其余 btop 自己补默认值（完整清单：btop --default-config）。
# 主题文件在 themes/：snappy（暗）和 snappy_light（亮），配色和 Ghostty 的 snappy 主题同一套。

# 主题名由 bin/btop 包装脚本按系统明暗在启动时替换（btop 没有命令行选主题的参数）；直接跑 /opt/homebrew/bin/btop 时用这里的值
color_theme = "snappy"

# 不画自己的背景色，透出 Ghostty 的半透明毛玻璃；开着的话整个界面是一块不透明色板
theme_background = false

truecolor = true
rounded_corners = true
graph_symbol = "braille"

# 退出时不回写配置：这个文件软链自 ~/.dotfiles，btop 回写会把注释全冲掉、git 里出脏改动。要改设置就改这个文件
save_config_on_exit = false
