# ===== 基础 =====
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
# 写死路径，不依赖继承来的 $SHELL（否则老 server 会一直开 bash）
# Ubuntu 的 zsh 在 /usr/bin/zsh，macOS 只有 /bin/zsh
if-shell 'test -x /usr/bin/zsh' \
  'set -g default-shell /usr/bin/zsh ; set -g default-command /usr/bin/zsh' \
  'set -g default-shell /bin/zsh ; set -g default-command /bin/zsh'
set -sg escape-time 0
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g focus-events on
set -g set-clipboard on
# 让 yazi 等程序的图片（kitty 图形协议）能穿过 tmux 到 Ghostty；新窗格继承 TERM_PROGRAM 以便识别终端
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g set-titles on
set -g set-titles-string '#S · #W'
setw -g automatic-rename off
setw -g allow-rename off
set -g visual-bell off
set -g visual-activity off
setw -g monitor-activity on

# ===== 键位 =====
# 记不住就按 Alt+m 开菜单，或 prefix + ? 看速查表
# macOS：Option 就是 Alt（macos.ghostty 里 macos-option-as-alt = true），下面的 M- 键位全部照用

# 菜单开着时按键不会传给外面，所以"再按一次 Alt+m / Option+m 关闭"靠菜单末尾那个键为 M-m 的空命令项实现
bind -n -N "打开 / 关闭 tmux 菜单" M-m display-menu -T "#[align=centre]  tmux  " -x C -y C \
  "右侧分屏"              s "split-window -h -c '#{pane_current_path}'" \
  "下方分屏"              d "split-window -v -c '#{pane_current_path}'" \
  "全屏 / 还原窗格"       f "resize-pane -Z" \
  "" \
  "新窗口里启动 Claude Code" C "new-window -n claude -c '#{pane_current_path}' ; send-keys 'claude' Enter" \
  "恢复某个 Claude 会话…"  r "new-window -n claude -c '#{pane_current_path}' ; send-keys 'claude --resume' Enter" \
  "继续上一次 Claude 会话" c "new-window -n claude -c '#{pane_current_path}' ; send-keys 'claude --continue' Enter" \
  "文件管理器 yazi"       y "new-window -n yazi -c '#{pane_current_path}' yazi" \
  "lazygit"               g "new-window -n lazygit -c '#{pane_current_path}' lazygit" \
  "btop 系统监视器"       b "new-window -n btop btop" \
  "" \
  "布局：左右排开"        | "select-layout even-horizontal" \
  "布局：上下排开"        _ "select-layout even-vertical" \
  "布局：平铺（网格）"    = "select-layout tiled" \
  "" \
  "当前窗格左移"          H "run-shell '~/.local/bin/tmux/move-pane.sh L #{pane_id}'" \
  "当前窗格右移"          L "run-shell '~/.local/bin/tmux/move-pane.sh R #{pane_id}'" \
  "当前窗口左移（标签往前）" < "if -F '#{==:#{window_index},1}' '' 'swap-window -d -t -1'" \
  "当前窗口右移（标签往后）" > "if -F '#{==:#{window_index},#{session_windows}}' '' 'swap-window -d -t +1'" \
  "" \
  "翻历史 / 复制模式"     v "copy-mode" \
  "搜索本窗格输出"        / "command-prompt -p '搜索:' 'copy-mode ; send -X search-backward \"%%\"'" \
  "粘贴（最近一次复制）"  p "paste-buffer -p" \
  "剪贴板历史…"           P "choose-buffer -Z" \
  "保存本窗格输出到文件"  S "run-shell '~/.local/bin/tmux/save-pane.sh'" \
  "" \
  "会话（挂起 / 切换）…"  z "display-menu -T '#[align=centre]  会话  ' -x C -y C \
      '挂起会话（程序继续跑）' d detach-client \
      '' \
      '切换会话 / 打开项目…'   s 'display-popup -w 60% -h 60% -E \"~/.local/bin/tmux/switch-session.sh\"' \
      '新建会话'               n 'command-prompt -p \"新会话名:\" \"new-session -s %%\"' \
      '重命名当前会话'         r 'command-prompt -I \"#S\" \"rename-session %%\"' \
      '' \
      '关闭整个会话'           X 'confirm-before -p \"关闭会话 #S? (y/n)\" kill-session' \
      '选一个别的会话关掉…'    k 'choose-tree -Zs -f \"#{==:#{session_attached},0}\" \"kill-session -t %%\"' \
      '关掉除当前外的全部会话' K 'confirm-before -p \"关掉除 #S 外的全部会话? (y/n)\" \"kill-session -a\"' \
      '' \
      '关闭菜单'               M-m ''" \
  "" \
  "关闭窗格"              x "kill-pane" \
  "关闭整个窗口"          X "kill-window" \
  "" \
  "快捷键速查表"          ? "display-popup -w 70% -h 80% -E '~/.local/bin/tmux/cheatsheet.sh'" \
  "" \
  "关闭菜单"              M-m ""

bind -n -N "挂起会话（程序继续跑）" M-d detach-client

bind -N "快捷键速查表" ? display-popup -w 70% -h 80% -E "~/.local/bin/tmux/cheatsheet.sh"
# 下面两个是 tmux 默认键，重绑一遍只为带上 -N 说明、进速查表
bind -N "粘贴最近一次复制" ] paste-buffer -p
bind -N "剪贴板历史（挑一条粘贴）" = choose-buffer -Z
# 会话列表里挑一个关掉；只列没人连着的会话，当前所在的（和别的窗口正在看的）不会出现，不会误杀
bind -N "选一个别的会话关掉" K choose-tree -Zs -f "#{==:#{session_attached},0}" "kill-session -t %%"
bind -N "重载配置文件" r source-file ~/.config/tmux/tmux.conf \; display "配置已重载"

# 分屏，继承当前目录
bind -N "右侧分屏" | split-window -h -c "#{pane_current_path}"
bind -N "下方分屏" - split-window -v -c "#{pane_current_path}"
bind -N "新建窗口" c new-window -c "#{pane_current_path}"

# 免前缀
bind -n -N "切到左边窗格" M-h select-pane -L
bind -n -N "切到下边窗格" M-j select-pane -D
bind -n -N "切到上边窗格" M-k select-pane -U
bind -n -N "切到右边窗格" M-l select-pane -R
# 移动窗格：Shift 加上去就是"把它挪过去"而不是"切过去"（i3 的习惯）。
# 焦点跟着走，连按就一直挪；到边不绕圈；全屏状态下也能挪（背后换位，保持全屏）
bind -n -N "当前窗格左移" M-H run-shell "~/.local/bin/tmux/move-pane.sh L #{pane_id}"
bind -n -N "当前窗格下移" M-J run-shell "~/.local/bin/tmux/move-pane.sh D #{pane_id}"
bind -n -N "当前窗格上移" M-K run-shell "~/.local/bin/tmux/move-pane.sh U #{pane_id}"
bind -n -N "当前窗格右移" M-L run-shell "~/.local/bin/tmux/move-pane.sh R #{pane_id}"
bind -n -N "全屏 / 还原当前窗格" M-f resize-pane -Z
# 调当前窗格大小，每次 5 格；相邻窗格自动跟着缩放
bind -n -r -N "当前窗格向左扩 / 缩" M-S-Left  resize-pane -L 5
bind -n -r -N "当前窗格向右扩 / 缩" M-S-Right resize-pane -R 5
bind -n -r -N "当前窗格向上扩 / 缩" M-S-Up    resize-pane -U 5
bind -n -r -N "当前窗格向下扩 / 缩" M-S-Down  resize-pane -D 5
bind -n -N "切到窗口 1" M-1 select-window -t 1
bind -n -N "切到窗口 2" M-2 select-window -t 2
bind -n -N "切到窗口 3" M-3 select-window -t 3
bind -n -N "切到窗口 4" M-4 select-window -t 4
bind -n -N "切到窗口 5" M-5 select-window -t 5
bind -n -N "新建窗口" M-n new-window -c "#{pane_current_path}"
# 在当前目录新开一个叫 claude 的窗口并启动 Claude Code。
# 先开正常 shell 再把命令敲进去，而不是 new-window 直接跑 claude：PATH 走完整的 zshrc，
# 而且 claude 退出后窗口留着回到 shell，不会凭空消失
# yazi 文件管理器：新开一个窗口全屏跑，q 退出窗口就没了，回到原来的窗口。
# 不用 display-popup：yazi 26.x 在浮层里退出要卡 5 秒（sxyazi/yazi#4361，
# 它探测终端的回复被 tmux 送去了活动窗格，浮层不是活动窗格，只能等超时）
bind -n -N "打开 yazi 文件管理器" M-y new-window -n yazi -c "#{pane_current_path}" yazi
# 会话 / 项目切换器：fzf 列出现有会话和项目目录，选中即切；目录会新建同名会话
bind -n -N "切换会话 / 打开项目（fzf）" M-s display-popup -w 60% -h 60% -E "~/.local/bin/tmux/switch-session.sh"
# btop 系统监视器：新窗口，q 退出即关
bind -n -N "打开 btop 系统监视器" M-b new-window -n btop -c "#{pane_current_path}" btop
# lazygit：同样开在自己的窗口里，q 退出即关
bind -n -N "打开 lazygit" M-g new-window -n lazygit -c "#{pane_current_path}" lazygit
bind -n -N "新窗口里启动 Claude Code" M-c new-window -n claude -c "#{pane_current_path}" \; send-keys "claude" Enter
bind -n -N "回到上一个窗口" "M-;" last-window
bind -n -N "上一个窗口" M-Left previous-window
bind -n -N "下一个窗口" M-Right next-window
# 移动窗口（顶栏标签换位置），焦点跟着走；到头了不绕回另一端
# base-index 1 + renumber-windows on，所以第一个永远是 1，最后一个永远是 #{session_windows}
bind -n -N "当前窗口左移（标签往前）" "M-<" if -F '#{==:#{window_index},1}' '' 'swap-window -d -t -1'
bind -n -N "当前窗口右移（标签往后）" "M->" if -F '#{==:#{window_index},#{session_windows}}' '' 'swap-window -d -t +1'

# 复制模式用 vi 键位，y 复制到系统剪贴板
# 走 OSC 52（set-clipboard on + Ghostty 的 clipboard-write），不依赖 xsel/wl-copy，SSH 里也能用
setw -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -n -N "向上翻历史" PageUp copy-mode -u

# ===== 状态栏（用调色板索引，换主题自动跟随）=====
set -g status-style 'bg=default,fg=colour7'
set -g status-position top
# 窗口列表居中（absolute-centre = 对齐整条状态栏的正中，不受左右两侧宽度影响）
set -g status-justify absolute-centre
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 100

# ===== 窗格边框与标题栏 =====
set -g pane-border-lines heavy
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour4'
set -g pane-border-format '#{?pane_active,#[fg=colour4#,bold],#[fg=colour8]} #{pane_index} · #{pane_current_command} · #{s,^/(home|Users)/[^/]*,~,:pane_current_path} '
# 只有多个窗格时才显示标题栏，单窗格不浪费一行
set -g pane-border-status off
set-hook -g window-layout-changed[50] 'set -w -F pane-border-status "#{?#{>:#{window_panes},1},top,off}"'
set-hook -g after-split-window[50]    'set -w -F pane-border-status "#{?#{>:#{window_panes},1},top,off}"'
set-hook -g after-kill-pane[50]       'set -w -F pane-border-status "#{?#{>:#{window_panes},1},top,off}"'
set -g message-style 'bg=colour0,fg=colour6'
set -g mode-style 'bg=colour4,fg=colour0'

# Claude Code 状态 → 窗口号颜色（黄=等批准 绿=完成 红=出错 青=运行 常规色=空闲）
set -g @cc-style '#{?#{==:#{@agent-state},waiting},fg=colour3#,bold,#{?#{==:#{@agent-state},done},fg=colour2#,bold,#{?#{==:#{@agent-state},error},fg=colour1#,bold,#{?#{==:#{@agent-state},running},fg=colour6,fg=colour7}}}}'

# 有几个窗口的 Claude 在等你批准：黄色计数，没有就不显示（W: 遍历窗口，n: 取长度）
set -g @cc-waiting '#{n:#{W:#{?#{==:#{@agent-state},waiting},x,}}}'
# 会话名只在有多个会话时显示（#, 是转义的逗号）
set -g status-left '#[fg=colour5,bold]#{?client_prefix,▶,▎}#{?#{>:#{server_sessions},1},#[fg=colour4#,bold] #S #[fg=colour8]│,}#{?#{E:@cc-waiting},#[fg=colour3#,bold] 󰂚 #{E:@cc-waiting} #[fg=colour8]│,} '

# 当前窗口：亮色竖条 + 加粗亮白名字；其他窗口：无竖条 + 常规色名字（colour8 压在亮背景上只有 1.9:1，看不清）
set -g window-status-current-format '#[fg=colour4,bold]▎#[#{E:@cc-style}]#I#[fg=colour15,bold]:#W '
set -g window-status-format ' #[#{E:@cc-style}]#I#[fg=colour7]:#W '
set -g window-status-activity-style 'none'

# 电池段和负载段都由脚本自带分隔符；台式机上电池脚本不输出，这一段整个消失
# 负载：CPU% · 已用内存 · GPU%（取不到 GPU 的机器不显示），>70% 黄 >90% 红
set -g status-right '#[fg=colour7]#{pane_current_path} #[fg=colour8]│ #(~/.local/bin/tmux/sysload.sh)#(~/.local/bin/tmux/battery.sh)#[fg=colour4]%H:%M '

# ===== 插件（tpm）=====
# 插件目录放 ~/.config/tmux/plugins，不散在 ~/.tmux
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 存档时连窗格内容一起存
set -g @resurrect-capture-pane-contents 'on'
# 每 15 分钟自动存，tmux 启动时自动恢复
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# 这行必须在最后
run '~/.config/tmux/plugins/tpm/tpm'

