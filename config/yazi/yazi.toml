# yazi 配置。颜色默认跟随终端的 16 色调色板，换 Ghostty 主题自动跟随，不另配主题。

[mgr]
# 显示隐藏文件（.dotfiles、.config 这类经常要进）
show_hidden = true
# 顺序：普通目录 → 普通文件 → 隐藏目录 → 隐藏文件，每组内按修改时间倒序（最新在上）。
# yazi 自带的排序做不到"隐藏文件放最后"（作者拒了对应 PR），所以用 custom 排序 + plugins/hidden-last.yazi 算顺序。
# custom 需要 26.9.1 之后的版本（brew 的 26.9.1 会报 unknown variant `custom`）；macOS 上目前装的是
# ~/.local/bin/yazi（nightly），等 brew 出下一个版本后删掉它即可。
# reverse / dir_first 必须关：插件已经把"目录在前、时间倒序"编进 rank 里，这两个开着会把顺序翻回去。
sort_by = "custom"
sort_reverse = false
sort_dir_first = false
sort_fallback = "natural"
sort_sensitive = false
# 三栏比例：父目录 / 当前目录 / 预览。预览给大一点，看代码和 PDF 舒服
ratio = [1, 3, 4]
# 状态栏显示文件大小和修改时间
linemode = "size"
show_symlink = true

[preview]
# 图片预览的最大尺寸（像素）。缩放一次后缓存，不会重复解码
max_width = 1200
max_height = 1600
# 预览缓存放这里；清理用 ya cache clear
cache_dir = ""
# 代码预览带行号，Tab 显示为 4 格
tab_size = 4

[opener]
# Enter 打开文件：文本进 $EDITOR，其余交给系统默认程序
edit = [
  { run = '${EDITOR:-nvim} "$@"', block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$1"', desc = "打开", for = "linux" },
  { run = 'open "$@"',     desc = "打开", for = "macos" },
]
